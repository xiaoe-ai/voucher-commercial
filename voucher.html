<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09203e">
<title>Digital Voucher</title>
<meta name="description" content="Open your secure digital voucher, view the QR code, validity and redemption locations.">
<meta property="og:type" content="website">
<meta property="og:title" content="Digital Voucher">
<meta property="og:description" content="Tap to view your secure digital voucher, QR code, validity and redemption locations.">
<meta property="og:url" content="https://xiaoe-ai.github.io/voucher-commercial/voucher.html">
<meta property="og:site_name" content="Commercial Voucher">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Digital Voucher">
<meta name="twitter:description" content="Tap to view your secure digital voucher, QR code, validity and redemption locations.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="commercial-brand.js"></script>
<style>
:root{--navy:#09203e;--ink:#111827;--muted:#64748b;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf3ff,#f8fbff 48%,#edf5ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.top{padding:calc(20px + env(safe-area-inset-top)) 18px 20px;background:linear-gradient(135deg,#09203e,#06162d);color:#fff;text-align:center;box-shadow:0 12px 30px #09203e33}.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;color:#cbd5e1}
.wrap{width:min(680px,calc(100% - 22px));margin:18px auto 40px}.card{background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:18px;box-shadow:0 16px 38px #244a7a1a}.hidden{display:none!important}
.status{display:flex;justify-content:center;margin-bottom:14px}.pill{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:950}.valid{background:#ecfdf3;color:#15803d}.redeemed{background:#eff6ff;color:#1d4ed8}.expired,.invalid{background:#fef2f2;color:#b91c1c}
.offer{padding:18px;border-radius:18px;color:#fff;background:linear-gradient(90deg,#092b72,#0b5eb8 56%,#1685d1 78%,#07377d);text-align:center}.offer-title{font-size:28px;font-weight:950;line-height:1.1}.offer-subtitle{margin-top:7px;font-size:14px;opacity:.9}.offer-value{margin-top:12px;font-size:30px;font-weight:950}
.info{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border:1px solid #d7e7f7;border-radius:16px;overflow:hidden}.cell{padding:12px;border-bottom:1px solid #d7e7f7}.cell:nth-child(odd){border-right:1px solid #d7e7f7}.label{display:block;color:#2563eb;font-size:11px;font-weight:900}.data{display:block;margin-top:5px;font-weight:850;word-break:break-word}
.qrwrap{display:grid;place-items:center;margin:18px auto 6px}.qr{width:220px;height:220px;padding:9px;border:4px solid #0c55b3;border-radius:18px;background:#fff}.qr img,.qr canvas{width:100%!important;height:100%!important}.scan{margin-top:7px;color:#0c55b3;font-weight:900;font-size:12px}
.branches{margin-top:18px}.branches h3{margin:0 0 9px}.branch{padding:12px 13px;margin-top:9px;border:1px solid #dce7f4;border-radius:14px;background:#f8fbff}.branch b{display:block}.branch span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.note{margin-top:16px;padding:12px;border-radius:14px;background:#f8fafc;color:#475569;font-size:13px;line-height:1.5;text-align:center}.error{text-align:center;padding:28px 12px}.error h2{color:var(--red)}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}
@media(max-width:520px){.card{padding:13px}.offer-title{font-size:24px}.data{font-size:13px}.qr{width:205px;height:205px}}
</style></head>
<body>
<header class="top"><h1 id="companyName">Your Company</h1><p>Digital Voucher</p></header>
<main class="wrap">
<section id="loading" class="card"><div class="note">Loading voucher…</div></section>
<section id="errorCard" class="card hidden"><div class="error"><h2>Voucher unavailable</h2><p id="errorText">This voucher link is invalid or unavailable.</p></div></section>
<section id="voucherCard" class="card hidden">
<div class="status"><span id="statusPill" class="pill">VALID</span></div>
<div class="offer"><div id="offerTitle" class="offer-title">Voucher</div><div id="offerSubtitle" class="offer-subtitle hidden"></div><div id="offerValue" class="offer-value hidden"></div></div>
<div class="info">
<div class="cell"><span class="label">PARTNER</span><span id="partner" class="data">—</span></div>
<div class="cell"><span class="label">CUSTOMER</span><span id="customer" class="data">—</span></div>
<div class="cell"><span class="label">VALID UNTIL</span><span id="expiry" class="data">—</span></div>
<div class="cell"><span class="label">VOUCHER CODE</span><span id="code" class="data">—</span></div>
</div>
<div class="qrwrap"><div id="qr" class="qr"></div><div class="scan">SHOW THIS QR TO STAFF</div></div>
<div class="branches"><h3>Redeem at</h3><div id="branchList"></div></div>
<div id="stateNote" class="note">Voucher status is checked live.</div>
</section>
<div class="footer"><span id="footerCompany">Your Company</span> • Secure Digital Voucher</div>
</main>
<script>
const SUPABASE_URL="https://hukihbcyyqhanaqrizvm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_kpPFeGYpedq2auo01Zo50A_aiSjdeVh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fail(t){$("loading").classList.add("hidden");$("voucherCard").classList.add("hidden");$("errorCard").classList.remove("hidden");$("errorText").textContent=t}
function first(...values){return values.find(v=>v!==undefined&&v!==null&&String(v).trim()!=="")}
(async()=>{
 const token=new URLSearchParams(location.search).get("v"); if(!token){fail("This voucher link is incomplete.");return}
 const {data,error}=await db.rpc("get_public_voucher",{p_token:token});
 if(error){console.error("get_public_voucher RPC error:",error);fail("Unable to verify this voucher right now. Please try again.");return}
 const voucher=Array.isArray(data)?data[0]:data;
 if(!voucher||voucher.success!==true){console.error("Unexpected voucher response:",data);fail("This voucher link is invalid or unavailable.");return}
 $("loading").classList.add("hidden");$("voucherCard").classList.remove("hidden");
 const localProfile=window.CommercialCompanyProfile?.load?.()||{};
 const company=first(voucher.company_name,voucher.merchant_name,voucher.brand_name,localProfile.companyName,"Your Company");
 $("companyName").textContent=company;$("footerCompany").textContent=company;document.title=`${company} • Digital Voucher`;
 $("offerTitle").textContent=first(voucher.offer_title,voucher.voucher_title,voucher.title,voucher.template_name,"Voucher");
 const subtitle=first(voucher.offer_subtitle,voucher.description,voucher.voucher_description);
 if(subtitle){$("offerSubtitle").textContent=subtitle;$("offerSubtitle").classList.remove("hidden")}
 const value=first(voucher.display_value,voucher.value_label,voucher.amount_label);
 if(value){$("offerValue").textContent=value;$("offerValue").classList.remove("hidden")}
 $("partner").textContent=voucher.partner_name||"Partner";$("customer").textContent=voucher.customer_name||"—";$("expiry").textContent=voucher.expiry_date||"—";$("code").textContent=voucher.voucher_code||"—";
 const s=String(voucher.status||"valid").toLowerCase(),pill=$("statusPill");pill.textContent=s.toUpperCase();pill.className="pill "+(s==="valid"?"valid":s==="redeemed"?"redeemed":s==="expired"?"expired":"invalid");
 if(s==="redeemed")$("stateNote").textContent="This voucher has already been redeemed.";else if(s==="expired")$("stateNote").textContent="This voucher has expired.";else if(s!=="valid")$("stateNote").textContent="This voucher is currently not valid for redemption.";
 new QRCode($("qr"),{text:voucher.voucher_code,width:420,height:420,correctLevel:QRCode.CorrectLevel.M});
 const rows=Array.isArray(voucher.branches)?voucher.branches:[];
 $("branchList").innerHTML=rows.length?rows.map(b=>{const name=b.branch_name||b.name||b.branch_code||"Redemption location",a=b.address||"",p=b.phone||"";return `<div class="branch"><b>${esc(name)}</b>${a?`<span>${esc(a)}</span>`:""}${p?`<span>☎ ${esc(p)}</span>`:""}</div>`}).join(""):'<div class="branch"><b>Please contact the issuing company for redemption locations.</b></div>';
})();
</script></body></html>
