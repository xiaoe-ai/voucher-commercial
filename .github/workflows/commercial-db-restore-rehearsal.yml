name: Commercial DB Restore Rehearsal

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/canonical/**'
      - '.github/workflows/commercial-db-restore-rehearsal.yml'

permissions:
  contents: read

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Create blank source and recovery databases
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
          end $$;
          SQL
          createdb commercial_source
          createdb commercial_recovery

      - name: Bootstrap source auth shim
        shell: bash
        run: |
          set -euo pipefail
          psql -d commercial_source -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text,
            created_at timestamptz not null default now()
          );
          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true),'')::uuid $$;
          create or replace function auth.jwt()
          returns jsonb language sql stable
          as $$ select coalesce(nullif(current_setting('request.jwt.claims', true),'')::jsonb, '{}'::jsonb) $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          grant execute on function auth.jwt() to anon, authenticated, service_role;
          grant select on auth.users to service_role;
          SQL

      - name: Apply canonical source baseline
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find supabase/canonical -maxdepth 1 -type f -name '*.sql' | sort); do
            psql -d commercial_source -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed Commercial-neutral recovery fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -d commercial_source -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id,email) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','restore-admin@example.invalid'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','restore-partner@example.invalid'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','restore-staff@example.invalid');

          update public.company_profile
             set company_name='Recovery Fixture Company',
                 company_legal_name='Recovery Fixture Company Ltd',
                 registration_no='RECOVERY-TEST'
           where id='default';

          insert into public.partners(id,partner_code,partner_name,status) values
            ('10000000-0000-4000-8000-000000000001','ADMIN','Commercial Voucher Admin','active'),
            ('10000000-0000-4000-8000-000000000002','RESTORE-PARTNER','Recovery Partner','active');

          insert into public.partner_users(user_id,partner_id,role,status,login_email) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','10000000-0000-4000-8000-000000000001','admin','active','restore-admin@example.invalid'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','10000000-0000-4000-8000-000000000002','partner_admin','active','restore-partner@example.invalid');

          insert into public.branches(id,branch_code,branch_name,status) values
            ('20000000-0000-4000-8000-000000000001','RESTORE-BRANCH','Recovery Branch','active');

          insert into public.staff_users(user_id,branch_id,staff_name,role,status) values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','20000000-0000-4000-8000-000000000001','Recovery Staff','staff','active');
          SQL

      - name: Create logical backup
        shell: bash
        run: |
          set -euo pipefail
          pg_dump -d commercial_source --format=custom --no-owner --no-acl --file=/tmp/commercial-recovery.dump
          test -s /tmp/commercial-recovery.dump
          sha256sum /tmp/commercial-recovery.dump | tee /tmp/commercial-recovery.sha256

      - name: Restore into blank isolated recovery target
        shell: bash
        run: |
          set -euo pipefail
          pg_restore -d commercial_recovery --no-owner --no-acl --exit-on-error /tmp/commercial-recovery.dump

      - name: Verify restored schema functions RLS and business data
        shell: bash
        run: |
          set -euo pipefail
          psql -d commercial_recovery -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE') < 16 then
              raise exception 'Recovered public table count below canonical minimum';
            end if;
            if not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='verify_voucher'
            ) then raise exception 'verify_voucher missing after restore'; end if;
            if not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='redeem_voucher'
            ) then raise exception 'redeem_voucher missing after restore'; end if;
            if not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='service_bootstrap_first_admin'
            ) then raise exception 'service_bootstrap_first_admin missing after restore'; end if;
            if exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind='r'
                and c.relname in ('partners','partner_users','staff_users','branches','vouchers','redemptions','company_profile')
                and not c.relrowsecurity
            ) then raise exception 'RLS disabled on recovered critical table'; end if;
            if (select count(*) from public.partners) <> 2 then raise exception 'Partner count mismatch'; end if;
            if (select count(*) from public.partner_users where status='active') <> 2 then raise exception 'Active partner_users count mismatch'; end if;
            if (select count(*) from public.branches) <> 1 then raise exception 'Branch count mismatch'; end if;
            if (select count(*) from public.staff_users where status='active') <> 1 then raise exception 'Active staff count mismatch'; end if;
            if not exists (
              select 1 from public.company_profile
              where id='default' and company_name='Recovery Fixture Company'
                and registration_no='RECOVERY-TEST'
            ) then raise exception 'Company profile fixture missing after restore'; end if;
          end $$;
          SQL

      - name: Verify restored authorization isolation
        shell: bash
        run: |
          set -euo pipefail
          psql -d commercial_recovery -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',false);
          do $$ begin
            if (select count(*) from public.partners) <> 1 then
              raise exception 'Recovered Partner isolation failed';
            end if;
            if exists(select 1 from public.partners where partner_code='ADMIN') then
              raise exception 'Recovered Partner can read Admin partner';
            end if;
          end $$;
          reset role;

          set role authenticated;
          select set_config('request.jwt.claim.sub','dddddddd-dddd-4ddd-8ddd-dddddddddddd',false);
          do $$ begin
            if (select count(*) from public.branches) <> 1 then
              raise exception 'Recovered Staff branch scope failed';
            end if;
          end $$;
          reset role;
          SQL

      - name: Verify recovered data remains Commercial-neutral
        shell: bash
        run: |
          set -euo pipefail
          psql -d commercial_recovery -At -c "select coalesce(string_agg(company_name,' '),'') from public.company_profile" > /tmp/company.txt
          if grep -niE 'Evolution Optical|EVO-FREE-GLASSES|RM59 Free Glasses|RM60 Free Glasses' /tmp/company.txt; then
            echo 'Legacy customer data leaked into recovery target.'
            exit 1
          fi

      - name: Emit database restore rehearsal evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'COMMERCIAL_DB_BACKUP_RESTORE_OK=true'
          echo 'RESTORE_TARGET=blank_isolated_postgresql17'
          echo 'SCHEMA_FUNCTION_RLS_OK=true'
          echo 'BUSINESS_FIXTURE_COUNTS_OK=true'
          echo 'AUTHORIZATION_AFTER_RESTORE_OK=true'
          echo 'LEGACY_CUSTOMER_SEED_ABSENT=true'
          cat /tmp/commercial-recovery.sha256
