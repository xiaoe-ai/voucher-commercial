name: Commercial Neutralization Phase 2A Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2a-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2a-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905102500_commercial_neutralization_phase2a_partner_issue.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test "$MIGRATION_PATH" = 'supabase/migrations/20260905102500_commercial_neutralization_phase2a_partner_issue.sql'
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Execute Phase 2A and rollback in one session
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo "select case when pg_get_functiondef('public.create_partner_multi_voucher_controlled(uuid,text,text)'::regprocedure) ilike '%Asia/Kuala_Lumpur%' then 1 else 0 end as has_fixed_timezone_during_dryrun;"
            echo "select case when pg_get_functiondef('public.create_partner_multi_voucher_controlled(uuid,text,text)'::regprocedure) ~ '(^|[^A-Za-z0-9_])EO-' then 1 else 0 end as has_legacy_prefix_during_dryrun;"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1
          echo 'Phase 2A dry-run completed and rolled back.'

      - name: Verify rollback preserved current live function
        shell: bash
        run: |
          set -euo pipefail
          has_fixed_timezone=$(psql -v ON_ERROR_STOP=1 -Atqc "select case when pg_get_functiondef('public.create_partner_multi_voucher_controlled(uuid,text,text)'::regprocedure) ilike '%Asia/Kuala_Lumpur%' then 1 else 0 end;")
          echo "fixed timezone after rollback: $has_fixed_timezone"
          test "$has_fixed_timezone" -eq 1
