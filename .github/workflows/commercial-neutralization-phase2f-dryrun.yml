name: Commercial Neutralization Phase 2F Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2f-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2f-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905130500_commercial_neutralization_phase2f_legacy_adapters.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Execute Phase 2F and rollback in one session
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            cat <<'SQL'
select 'FUNCTION_COUNT=' || count(*)
from pg_proc p join pg_namespace n on n.oid=p.pronamespace
where n.nspname='public'
  and p.proname in ('create_partner_voucher','create_partner_voucher_controlled','sync_single_voucher_partner_engine');

select 'LEGACY_RESIDUE_COUNT=' || count(*)
from pg_proc p join pg_namespace n on n.oid=p.pronamespace
where n.nspname='public'
  and p.proname in ('create_partner_voucher','create_partner_voucher_controlled','sync_single_voucher_partner_engine')
  and (
    pg_get_functiondef(p.oid) ilike '%EVO-FREE-GLASSES%'
    or pg_get_functiondef(p.oid) ilike '%RM60%'
    or pg_get_functiondef(p.oid) ilike '%Asia/Kuala_Lumpur%'
    or pg_get_functiondef(p.oid) ilike '%EO-%'
  );

select 'CONTROLLED_CALLS_GENERIC=' || exists (
  select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
  where n.nspname='public' and p.proname='create_partner_voucher_controlled'
    and pg_get_functiondef(p.oid) ilike '%create_partner_multi_voucher_controlled%'
);

select 'SYNC_IS_NOOP=' || exists (
  select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
  where n.nspname='public' and p.proname='sync_single_voucher_partner_engine'
    and pg_get_functiondef(p.oid) ilike '%return new%'
    and pg_get_functiondef(p.oid) not ilike '%insert into public.partner_voucher_access%'
);
ROLLBACK;
SQL
          } | psql -v ON_ERROR_STOP=1 -At | tee /tmp/phase2f.result

          grep -qx 'FUNCTION_COUNT=3' /tmp/phase2f.result
          grep -qx 'LEGACY_RESIDUE_COUNT=0' /tmp/phase2f.result
          grep -qx 'CONTROLLED_CALLS_GENERIC=true' /tmp/phase2f.result
          grep -qx 'SYNC_IS_NOOP=true' /tmp/phase2f.result

      - name: Verify rollback preserved current live definitions
        shell: bash
        run: |
          set -euo pipefail
          residue=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('create_partner_voucher','create_partner_voucher_controlled','sync_single_voucher_partner_engine') and (pg_get_functiondef(p.oid) ilike '%EVO-FREE-GLASSES%' or pg_get_functiondef(p.oid) ilike '%RM60%');")
          test "$residue" -ge 1
          echo 'Rollback preserved current live legacy definitions.'
