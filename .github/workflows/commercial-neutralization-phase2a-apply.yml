name: Commercial Neutralization Phase 2A Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2a-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2a-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905102500_commercial_neutralization_phase2a_partner_issue.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test "$MIGRATION_PATH" = 'supabase/migrations/20260905102500_commercial_neutralization_phase2a_partner_issue.sql'
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"
          echo 'Commercial Phase 2A apply route lock passed.'

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Apply Phase 2A transactionally
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1
          echo 'Commercial Phase 2A committed.'

      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_partner_multi_voucher_controlled' and pg_get_function_identity_arguments(p.oid)='p_version_id uuid, p_customer_name text, p_customer_phone text';")
          test -n "$body"
          if grep -q 'Asia/Kuala_Lumpur' <<<"$body"; then echo 'fixed timezone still present'; exit 1; fi
          if grep -q 'EO-' <<<"$body"; then echo 'legacy prefix still present'; exit 1; fi
          if grep -q 'EVO-FREE-GLASSES' <<<"$body"; then echo 'legacy template code still present'; exit 1; fi
          if ! grep -q "'V-'" <<<"$body"; then echo 'generic voucher prefix missing'; exit 1; fi
          if ! grep -q 'current_date' <<<"$body"; then echo 'current_date issuance date missing'; exit 1; fi
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2A_APPLIED=true'
