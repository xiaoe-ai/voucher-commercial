name: Commercial Neutralization Phase 2B Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2b-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2b-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905104000_commercial_neutralization_phase2b_share_reporting.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test "$MIGRATION_PATH" = 'supabase/migrations/20260905104000_commercial_neutralization_phase2b_share_reporting.sql'
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"
          echo 'Commercial Phase 2B dry-run route lock passed.'

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Execute Phase 2B and rollback in one session
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            cat <<'SQL'
          do $$
          declare
            r record;
            body text;
          begin
            for r in
              select p.oid,p.proname
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public'
                and p.proname in (
                  'get_partner_voucher_share','partner_recent_vouchers','partner_voucher_summary',
                  'staff_today_summary','admin_dashboard_summary','admin_voucher_report'
                )
            loop
              body := pg_get_functiondef(r.oid);
              if body ilike '%Evolution Optical%' then raise exception '% still has legacy brand copy',r.proname; end if;
              if body ilike '%Asia/Kuala_Lumpur%' then raise exception '% still has fixed timezone',r.proname; end if;
              if body ilike '%EVO-FREE-GLASSES%' then raise exception '% still has legacy template code',r.proname; end if;
            end loop;
          end
          $$;
          ROLLBACK;
          SQL
          } | psql -v ON_ERROR_STOP=1
          echo 'Phase 2B dry-run completed and rolled back.'

      - name: Verify rollback preserved current live definitions
        shell: bash
        run: |
          set -euo pipefail
          count=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(distinct p.proname) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('get_partner_voucher_share','partner_recent_vouchers','partner_voucher_summary','staff_today_summary','admin_dashboard_summary','admin_voucher_report');")
          echo "functions present after rollback: $count"
          test "$count" -eq 6
