name: Commercial white-label cleanup once

on:
  push:
    paths:
      - '.github/workflows/white-label-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe exact replacements
        shell: python
        run: |
          from pathlib import Path

          files = [
              'voucher-engine.html',
              'admin.html',
              'partner.html',
              'staff.html',
              'index.html',
              'admin-core.html',
          ]

          replacements = [
              ('https://xiaoe-ai.github.io/evolution-optical-voucher/', 'https://xiaoe-ai.github.io/voucher-commercial/'),
              ('Evolution Optical • Voucher Engine', 'Commercial Voucher • Voucher Engine'),
              ('Evolution Optical • Admin Portal', 'Commercial Voucher • Admin Portal'),
              ('Evolution Optical • Partner Portal', 'Commercial Voucher • Partner Portal'),
              ('Evolution Optical • Staff Portal', 'Commercial Voucher • Staff Portal'),
              ('Evolution Optical Partner Voucher Platform', 'Commercial Voucher Platform'),
              ('EVOLUTION OPTICAL', 'COMMERCIAL VOUCHER'),
              ('authorised Evolution Optical Admin account', 'authorised Commercial Voucher Admin account'),
              ('authorised Evolution Optical admin account', 'authorised Commercial Voucher admin account'),
              ('Create Evolution Optical staff login', 'Create staff login'),
              ('Active Evolution Optical branches.', 'Active redemption locations.'),
              ('All Evolution Optical branches', 'All redemption locations'),
              ('Scan, verify and redeem customer vouchers at Evolution Optical branches.', 'Scan, verify and redeem customer vouchers at authorised redemption locations.'),
              ('Evolution Optical • Partner Voucher Platform', 'Commercial Voucher Platform'),
              ('Welcome to Evolution Optical Partner Voucher Platform', 'Welcome to Commercial Voucher Platform'),
              ('Welcome to Evolution Optical Staff Portal', 'Welcome to Commercial Voucher Staff Portal'),
              ('Maximum Staff is set by Evolution Optical Admin.', 'Maximum Staff is set by the platform Admin.'),
              ('Theme and validity are controlled by Evolution Optical Admin.', 'Theme and validity are controlled by the platform Admin.'),
              ('Evolution Optical • Multi Voucher Theme Platform', 'Commercial Voucher • Multi Voucher Theme Platform'),
              ('Evolution Optical Voucher', 'Commercial Voucher'),
              ('present the attached QR voucher at Evolution Optical', 'present the attached QR voucher at an authorised redemption location'),
              ('Evolution Optical', 'Commercial Voucher'),
              ('e.g. EVO-RM100', 'e.g. VOUCHER-RM100'),
              ('RM100 Optical Voucher', 'RM100 Voucher'),
          ]

          changed = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(name)

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Verify protected compatibility identifiers remain
        shell: python
        run: |
          from pathlib import Path
          theme = Path('voucher-theme-system-v1.js').read_text(encoding='utf-8')
          if 'EOVoucherThemes' not in theme:
              raise SystemExit('Theme compatibility API unexpectedly changed')
          print('Theme compatibility API preserved')

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'xiaoe-white-label-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add voucher-engine.html admin.html partner.html staff.html index.html admin-core.html
          git commit -m 'refactor: remove EVO branding from commercial UI'
          git push
