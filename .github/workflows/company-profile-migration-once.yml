name: Company Profile Migration Once

on:
  push:
    paths:
      - '.github/workflows/company-profile-migration-once.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      MIGRATION_FILE: supabase/migrations/20260905053000_company_profile.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_V2 }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets without printing values
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo 'MISSING: SUPABASE_ACCESS_TOKEN_V2'; missing=1; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo 'MISSING: SUPABASE_DB_PASSWORD'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 2; fi
          echo 'Required Supabase deployment secrets are present.'

      - name: Verify registered migration only
        shell: bash
        run: |
          test -f "$MIGRATION_FILE"
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          if [ "$count" != '1' ]; then
            echo "Expected exactly one registered migration, found $count"
            exit 3
          fi
          echo 'Registered migration guard passed.'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Commercial project (debug)
        shell: bash
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --debug

      - name: Dry run migration
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Apply registered migration
        shell: bash
        run: supabase db push --linked
