name: Company Profile Migration Once

on:
  push:
    paths:
      - '.github/workflows/company-profile-migration-once.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      MIGRATION_FILE: supabase/migrations/20260905053000_company_profile.sql
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secret without printing value
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo 'MISSING: SUPABASE_DB_PASSWORD'
            exit 2
          fi
          echo 'Commercial database password is present.'

      - name: Verify registered migration only
        shell: bash
        run: |
          test -f "$MIGRATION_FILE"
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          if [ "$count" != '1' ]; then
            echo "Expected exactly one registered migration, found $count"
            exit 3
          fi
          echo 'Registered migration guard passed.'

      - name: Verify Commercial session pooler connection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -Atqc "select current_database(), current_user;"

      - name: Dry run migration in rollback transaction
        shell: bash
        run: |
          {
            echo 'BEGIN;'
            cat "$MIGRATION_FILE"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1

      - name: Apply registered migration transactionally
        shell: bash
        run: |
          {
            echo 'BEGIN;'
            cat "$MIGRATION_FILE"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1
