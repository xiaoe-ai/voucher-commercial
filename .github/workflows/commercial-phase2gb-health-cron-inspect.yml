name: Commercial Phase 2G-B Health Cron Inspect

on:
  push:
    paths:
      - '.github/commercial-phase2gb-health-cron-inspect-trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      INSPECT_PATH: supabase/migrations/20260905140500_phase2gb_health_cron_inspect.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Commercial route
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -f "$INSPECT_PATH"
      - name: Inspect health monitor and cron capabilities read-only
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            echo 'SET TRANSACTION READ ONLY;'
            cat "$INSPECT_PATH"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1
