name: Commercial GitHub Housekeeping

on:
  push:
    paths:
      - '.github/commercial-github-housekeeping-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-time workflows and triggers
        shell: bash
        run: |
          set -euo pipefail
          keep=(
            '.github/workflows/canonical-rebuild-check.yml'
            '.github/workflows/commercial-canonical-preflight.yml'
            '.github/workflows/commercial-migration-channel.yml'
            '.github/workflows/commercial-release-evidence.yml'
            '.github/workflows/commercial-schema-snapshot.yml'
          )

          rm -f .github/workflows/commercial-neutralization-phase*.yml
          rm -f .github/workflows/commercial-phase2*.yml
          rm -f .github/workflows/commercial-brand-runtime-cleanup.yml
          rm -f .github/workflows/frontend-source-cleanup.yml
          rm -f .github/workflows/frontend-runtime-neutralization.yml
          rm -f .github/workflows/frontend-runtime-neutralization-v2.yml

          rm -f .github/commercial-neutralization-phase*-trigger
          rm -f .github/commercial-phase2*-trigger
          rm -f .github/commercial-brand-runtime-cleanup-trigger
          rm -f .github/frontend-source-cleanup-trigger
          rm -f .github/frontend-runtime-neutralization-trigger
          rm -f .github/frontend-runtime-neutralization-v2-trigger

          test -f .github/commercial-canonical-preflight-trigger
          test -f .github/commercial-release-evidence-trigger
          test -f .github/schema-snapshot-trigger
          for f in "${keep[@]}"; do test -f "$f"; done

          if find .github/workflows -maxdepth 1 -type f \( -name 'commercial-neutralization-phase*.yml' -o -name 'commercial-phase2*.yml' -o -name 'frontend-*.yml' -o -name 'commercial-brand-runtime-cleanup.yml' \) | grep -q .; then
            echo 'Temporary workflow remains' >&2
            exit 1
          fi
          echo 'HOUSEKEEPING_ASSERTIONS=PASS'

      - name: Commit housekeeping and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/commercial-github-housekeeping.yml
          git rm -f .github/commercial-github-housekeeping-trigger || true
          git config user.name 'Xiao-E-26'
          git config user.email 'xiaoeai2026@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean completed Commercial GitHub workflows and triggers'
          git push origin HEAD:main
