name: Commercial Canonical Authorization Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/canonical/**'
      - '.github/workflows/canonical-authorization-check.yml'

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Supabase auth shim
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
          end $$;
          create schema if not exists auth;
          create table auth.users(id uuid primary key, email text, created_at timestamptz not null default now());
          create or replace function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true),'')::uuid
          $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$
            select coalesce(nullif(current_setting('request.jwt.claims', true),'')::jsonb,'{}'::jsonb)
          $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          grant execute on function auth.jwt() to anon, authenticated, service_role;
          grant select on auth.users to service_role;
          SQL

      - name: Apply canonical SQL
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find supabase/canonical -maxdepth 1 -type f -name '*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify Admin Partner Staff authorization isolation
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id,email) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','admin@example.invalid'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','partner-a@example.invalid'),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','partner-b@example.invalid'),
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','staff-a@example.invalid');

          insert into public.partners(id,partner_code,partner_name,status) values
            ('10000000-0000-4000-8000-000000000001','ADMIN','Commercial Voucher Admin','active'),
            ('10000000-0000-4000-8000-000000000002','PA','Partner A','active'),
            ('10000000-0000-4000-8000-000000000003','PB','Partner B','active');

          insert into public.partner_users(user_id,partner_id,role,status,login_email) values
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','10000000-0000-4000-8000-000000000001','admin','active','admin@example.invalid'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','10000000-0000-4000-8000-000000000002','partner_admin','active','partner-a@example.invalid'),
            ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','10000000-0000-4000-8000-000000000003','partner_admin','active','partner-b@example.invalid');

          insert into public.branches(id,branch_code,branch_name,status) values
            ('20000000-0000-4000-8000-000000000001','BA','Branch A','active'),
            ('20000000-0000-4000-8000-000000000002','BB','Branch B','active');
          insert into public.staff_users(user_id,branch_id,staff_name,role,status)
          values ('dddddddd-dddd-4ddd-8ddd-dddddddddddd','20000000-0000-4000-8000-000000000001','Staff A','staff','active');

          -- Admin: must see all partners.
          set role authenticated;
          select set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false);
          do $$ begin
            if (select count(*) from public.partners) <> 3 then
              raise exception 'Admin cannot read all partners';
            end if;
          end $$;
          reset role;

          -- Partner A: must see only own partner and own membership, not Partner B.
          set role authenticated;
          select set_config('request.jwt.claim.sub','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',false);
          do $$ begin
            if (select count(*) from public.partners) <> 1 then
              raise exception 'Partner isolation failed on partners';
            end if;
            if exists(select 1 from public.partners where partner_code='PB') then
              raise exception 'Partner A can read Partner B';
            end if;
            if (select count(*) from public.partner_users) <> 1 then
              raise exception 'Partner membership isolation failed';
            end if;
          end $$;
          reset role;

          -- Staff A: must see Branch A only, never Branch B.
          set role authenticated;
          select set_config('request.jwt.claim.sub','dddddddd-dddd-4ddd-8ddd-dddddddddddd',false);
          do $$ begin
            if (select count(*) from public.branches) <> 1 then
              raise exception 'Staff branch isolation failed';
            end if;
            if exists(select 1 from public.branches where branch_code='BB') then
              raise exception 'Staff A can read Branch B';
            end if;
          end $$;
          reset role;

          -- Partner A must not be able to update Partner B through RLS.
          set role authenticated;
          select set_config('request.jwt.claim.sub','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',false);
          do $$
          declare v_count integer;
          begin
            update public.partners set partner_name='UNAUTHORIZED' where partner_code='PB';
            get diagnostics v_count = row_count;
            if v_count <> 0 then raise exception 'Unauthorized cross-partner update succeeded'; end if;
          end $$;
          reset role;

          select 'AUTHORIZATION_MATRIX_OK=true';
          SQL
