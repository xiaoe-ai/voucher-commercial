name: Commercial Frontend Source Cleanup

on:
  push:
    paths:
      - '.github/frontend-source-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded frontend cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          partner = Path('partner.html')
          theme = Path('voucher-theme-system-v1.js')
          p = partner.read_text()
          t = theme.read_text()

          required = [
              'name="eo-partner-build"',
              'window.EOVoucherThemes',
              'const OUTLETS=',
              'RM${money(o.face_value)}',
          ]
          missing = [x for x in required if x not in p]
          if missing:
              raise SystemExit(f'partner.html expected legacy fragments missing: {missing}')
          if 'window.EOVoucherThemes=' not in t:
              raise SystemExit('theme legacy global assignment missing')

          p = p.replace('name="eo-partner-build"', 'name="commercial-partner-build"')
          p = p.replace('window.EOVoucherThemes', 'window.CommercialVoucherThemes')
          p = re.sub(r'const OUTLETS=\{.*?\};\n', '', p, count=1)
          p = p.replace('n.toLocaleString("en-MY",{maximumFractionDigits:2})', 'n.toLocaleString(navigator.language||"en-US",{maximumFractionDigits:2})')
          p = p.replace('if(o.face_value!=null)return `RM${money(o.face_value)} • ${o.template_name}`;', 'if(o.face_value!=null)return `Value ${money(o.face_value)} • ${o.template_name}`;')
          p = p.replace('const value=o.face_value!=null?`RM${money(o.face_value)}`:(o.discount_percent!=null?`${money(o.discount_percent)}%`:"GIFT");', 'const value=o.face_value!=null?`${money(o.face_value)}`:(o.discount_percent!=null?`${money(o.discount_percent)}%`:"GIFT");')

          old_load = 'async function loadBranchDirectory(){const{data,error}=await db.from("branches").select("id,branch_code,branch_name,status").eq("status","active");if(error)return;branchDirectory={};(data||[]).forEach(b=>{const fallback=OUTLETS[b.branch_code]||{};branchDirectory[b.branch_code]={name:cleanOutletName(b.branch_name||fallback.name||b.branch_code),address:fallback.address||"",phone:fallback.phone||""}})}'
          new_load = 'async function loadBranchDirectory(){let{data,error}=await db.from("branches").select("id,branch_code,branch_name,status,address_line1,address_line2,city,state,postcode,country,phone,whatsapp,map_url").eq("status","active");if(error){({data,error}=await db.from("branches").select("id,branch_code,branch_name,status").eq("status","active"))}if(error)return;branchDirectory={};(data||[]).forEach(b=>{const address=[b.address_line1,b.address_line2,b.postcode,b.city,b.state,b.country].map(v=>String(v||"").trim()).filter(Boolean).join(", ");branchDirectory[b.branch_code]={name:cleanOutletName(b.branch_name||b.branch_code),address,phone:String(b.phone||"").trim(),whatsapp:String(b.whatsapp||"").trim(),map_url:String(b.map_url||"").trim()}})}'
          if old_load not in p:
              raise SystemExit('expected old loadBranchDirectory not found')
          p = p.replace(old_load, new_load)

          old_codes = 'function redemptionCodesFor(o){if(!o)return[];const versionCodes=o.version_branch_codes||[];if(partnerClaimAll&&o.all_branches)return Object.keys(OUTLETS);if(partnerClaimAll&&!o.all_branches)return versionCodes;if(!partnerClaimAll&&o.all_branches)return partnerClaimCodes;return partnerClaimCodes.filter(c=>versionCodes.includes(c))}'
          new_codes = 'function redemptionCodesFor(o){if(!o)return[];const versionCodes=o.version_branch_codes||[];if(partnerClaimAll&&o.all_branches)return Object.keys(branchDirectory);if(partnerClaimAll&&!o.all_branches)return versionCodes.filter(c=>!!branchDirectory[c]);if(!partnerClaimAll&&o.all_branches)return partnerClaimCodes.filter(c=>!!branchDirectory[c]);return partnerClaimCodes.filter(c=>versionCodes.includes(c)&&!!branchDirectory[c])}'
          if old_codes not in p:
              raise SystemExit('expected old redemptionCodesFor not found')
          p = p.replace(old_codes, new_codes)

          old_summary = 'function outletSummaryFor(o){const codes=redemptionCodesFor(o);const dir=Object.keys(branchDirectory).length?branchDirectory:OUTLETS;return{details:codes.map(c=>dir[c]||OUTLETS[c]).filter(Boolean)}}'
          new_summary = 'function outletSummaryFor(o){const codes=redemptionCodesFor(o);return{details:codes.map(c=>branchDirectory[c]).filter(Boolean)}}'
          if old_summary not in p:
              raise SystemExit('expected old outletSummaryFor not found')
          p = p.replace(old_summary, new_summary)

          t = t.replace('window.EOVoucherThemes={THEMES,normalize,get,options,resolve,applyToVoucher,decorationSvg};', 'window.CommercialVoucherThemes={THEMES,normalize,get,options,resolve,applyToVoucher,decorationSvg};')

          forbidden_partner = [
              'eo-partner-build','EOVoucherThemes','const OUTLETS=','The Mines Shopping Mall','Damai Perdana 6/1E','RM${money(o.face_value)}'
          ]
          remains = [x for x in forbidden_partner if x in p]
          if remains:
              raise SystemExit(f'partner cleanup incomplete: {remains}')
          if 'EOVoucherThemes' in t:
              raise SystemExit('theme cleanup incomplete')
          for required_new in ['commercial-partner-build','CommercialVoucherThemes','address_line1','Object.keys(branchDirectory)','Value ${money(o.face_value)}']:
              if required_new not in p and required_new != 'CommercialVoucherThemes':
                  raise SystemExit(f'expected new partner fragment missing: {required_new}')
          if 'window.CommercialVoucherThemes=' not in t:
              raise SystemExit('new theme global missing')

          partner.write_text(p)
          theme.write_text(t)
          PY

      - name: Show diff and static assertions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- partner.html voucher-theme-system-v1.js
          ! grep -q 'EOVoucherThemes' partner.html
          ! grep -q 'const OUTLETS=' partner.html
          ! grep -q 'The Mines Shopping Mall' partner.html
          ! grep -q 'RM${money(o.face_value)}' partner.html
          ! grep -q 'EOVoucherThemes' voucher-theme-system-v1.js
          grep -q 'window.CommercialVoucherThemes=' voucher-theme-system-v1.js

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- partner.html voucher-theme-system-v1.js; then
            echo 'No frontend cleanup changes required.'
            exit 0
          fi
          git config user.name 'Xiao-E-26'
          git config user.email 'xiaoeai2026@gmail.com'
          git add partner.html voucher-theme-system-v1.js
          git commit -m 'Canonicalize Commercial partner frontend identifiers'
          git push origin HEAD:main
