name: Commercial Frontend Runtime Neutralization V2

on:
  push:
    paths:
      - '.github/frontend-runtime-neutralization-v2-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded current-runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = {
            'admin.html': Path('admin.html'),
            'admin-core.html': Path('admin-core.html'),
            'partner.html': Path('partner.html'),
            'staff.html': Path('staff.html'),
            'voucher-engine.html': Path('voucher-engine.html'),
          }
          text = {k:p.read_text() for k,p in files.items()}

          for k in text:
            text[k] = text[k].replace('"en-MY"', 'navigator.language||"en-US"')

          a=text['admin.html']
          a=a.replace('name="eo-admin-build"','name="commercial-admin-build"')
          for old,new in {
            'Create Partner + RM60 initial limit + Staff limit + branch permission.':'Create Partner + initial voucher limit + Staff limit + branch permission.',
            'RM60 compatibility quota remains here. Other Voucher Types are managed in Voucher Engine.':'Compatibility quota remains here. Other Voucher Types are managed in Voucher Engine.',
            'Initial RM60 Voucher Limit':'Initial Voucher Limit',
            'RM60 Voucher Limit must be 0 or more.':'Voucher Limit must be 0 or more.',
            'Create ${partner_name} with RM60 voucher limit ${voucher_limit} and staff limit ${staff_limit}?':'Create ${partner_name} with voucher limit ${voucher_limit} and staff limit ${staff_limit}?',
            'Cannot set below RM60 vouchers already issued.':'Cannot set below vouchers already issued.',
            'Set ${p.partner_name} RM60 total voucher limit to ${n}?':'Set ${p.partner_name} total voucher limit to ${n}?',
            '<span>RM60 Limit</span>':'<span>Legacy Limit</span>',
            '<span>RM60 Issued</span>':'<span>Legacy Issued</span>',
            '<span>RM60 Available</span>':'<span>Legacy Available</span>',
            'placeholder="RM60 voucher quantity"':'placeholder="Voucher quantity"',
            '>Set RM60 Total<':'>Set Total<',
            '>+ Add RM60<':'>+ Add<',
          }.items(): a=a.replace(old,new)
          a=a.replace('RM60','Legacy')
          a=a.replace('`RM${Number(ver.face_value).toLocaleString(navigator.language||"en-US",{maximumFractionDigits:2})} • `','`Value ${Number(ver.face_value).toLocaleString(navigator.language||"en-US",{maximumFractionDigits:2})} • `')
          a=a.replace('`RM${Number(r.ver.face_value).toLocaleString(navigator.language||"en-US",{maximumFractionDigits:2})}`','`Value ${Number(r.ver.face_value).toLocaleString(navigator.language||"en-US",{maximumFractionDigits:2})}`')
          a=a.replace('`evolution-vouchers-${new Date().toISOString().slice(0,10)}.xlsx`','`commercial-vouchers-${new Date().toISOString().slice(0,10)}.xlsx`')
          text['admin.html']=a

          ac=text['admin-core.html']
          ac=ac.replace('RM60 Free Glasses','Voucher')
          ac=ac.replace('`evolution-vouchers-${new Date().toISOString().slice(0,10)}.xlsx`','`commercial-vouchers-${new Date().toISOString().slice(0,10)}.xlsx`')
          text['admin-core.html']=ac

          p=text['partner.html']
          p=p.replace('<div class="av-appreciation">Sdn Bhd</div>','<div class="av-appreciation">Voucher</div>')
          p=p.replace('<div class="av-free" id="offerEyebrow">FREE</div>','<div class="av-free" id="offerEyebrow">VALUE</div>')
          p=p.replace('<div class="av-offer-copy" id="offerTitle">FREE GLASSES<br />VOUCHER</div>','<div class="av-offer-copy" id="offerTitle">VOUCHER</div>')
          p=p.replace('<strong id="offerValue">RM60</strong>','<strong id="offerValue">—</strong>')
          text['partner.html']=p

          s=text['staff.html']
          s=s.replace('name="eo-staff-build"','name="commercial-staff-build"')
          s=s.replace('placeholder="EO-20260808-XXXXXXX"','placeholder="V-20260808-XXXXXXXX"')
          text['staff.html']=s

          v=text['voucher-engine.html']
          v=v.replace('name="eo-voucher-engine-build"','name="commercial-voucher-engine-build"')
          v=v.replace('window.EOVoucherThemes','window.CommercialVoucherThemes')
          v=v.replace('Template Code</label><input id="tCode" placeholder="e.g. VOUCHER-RM100"','Template Code</label><input id="tCode" placeholder="e.g. CASH-100"')
          v=v.replace('Template Name</label><input id="tName" placeholder="RM100 Voucher"','Template Name</label><input id="tName" placeholder="100 Value Voucher"')
          v=v.replace('Face Value (RM)','Face Value')
          v=v.replace('Minimum Spend (RM)','Minimum Spend')
          text['voucher-engine.html']=v

          forbidden={
            'admin.html':['en-MY','RM60','evolution-vouchers-'],
            'admin-core.html':['en-MY','RM60 Free Glasses','evolution-vouchers-'],
            'partner.html':['RM60','FREE GLASSES','<div class="av-appreciation">Sdn Bhd</div>'],
            'staff.html':['en-MY','EO-20260808-XXXXXXX'],
            'voucher-engine.html':['EOVoucherThemes','VOUCHER-RM100','RM100 Voucher','Face Value (RM)','Minimum Spend (RM)'],
          }
          for k,bad in forbidden.items():
            remain=[x for x in bad if x in text[k]]
            if remain: raise SystemExit(f'{k} cleanup incomplete: {remain}')

          for k,pth in files.items(): pth.write_text(text[k])
          PY

      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'en-MY' admin.html admin-core.html staff.html voucher-engine.html
          ! grep -q 'RM60' admin.html admin-core.html partner.html
          ! grep -q 'evolution-vouchers-' admin.html admin-core.html
          ! grep -q 'EOVoucherThemes' voucher-engine.html
          ! grep -q 'EO-20260808-XXXXXXX' staff.html
          ! grep -q 'FREE GLASSES' partner.html
          grep -q 'commercial-admin-build' admin.html
          grep -q 'commercial-voucher-engine-build' voucher-engine.html
          grep -q 'CommercialVoucherThemes' voucher-engine.html
          grep -q 'V-20260808-XXXXXXXX' staff.html

      - name: Commit runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin.html admin-core.html partner.html staff.html voucher-engine.html; then
            echo 'No runtime cleanup changes required.'
            exit 0
          fi
          git config user.name 'Xiao-E-26'
          git config user.email 'xiaoeai2026@gmail.com'
          git add admin.html admin-core.html partner.html staff.html voucher-engine.html
          git commit -m 'Complete Commercial frontend runtime neutralization'
          git push origin HEAD:main
