name: Commercial Neutralization Phase 2G-A Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2ga-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2ga-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905135000_commercial_neutralization_phase2ga_bootstrap.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Commercial route
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -f "$MIGRATION_PATH"
      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          test "$result" = 'postgres|postgres'
      - name: Execute Phase 2G-A and rollback
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo "select 'OLD_BRAND_COUNT=' || count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin' and pg_get_functiondef(p.oid) ilike '%Evolution Optical Admin%';"
            echo "select 'OLD_LOCK_COUNT=' || count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin' and pg_get_functiondef(p.oid) ilike '%evolution_voucher:first_admin_bootstrap%';"
            echo "select 'NEW_ADMIN_NAME=' || (pg_get_functiondef(p.oid) ilike '%Commercial Voucher Admin%') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin';"
            echo "select 'NEW_LOCK_NAME=' || (pg_get_functiondef(p.oid) ilike '%commercial_voucher:first_admin_bootstrap%') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin';"
            echo "select 'SETUP_HASH_LOGIC=' || (pg_get_functiondef(p.oid) ilike '%digest(p_setup_code%') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin';"
            echo "select 'CONSUME_LOGIC=' || (pg_get_functiondef(p.oid) ilike '%consumed_at=now()%') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin';"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1 -At | tee /tmp/phase2ga.result
          grep -qx 'OLD_BRAND_COUNT=0' /tmp/phase2ga.result
          grep -qx 'OLD_LOCK_COUNT=0' /tmp/phase2ga.result
          grep -qx 'NEW_ADMIN_NAME=true' /tmp/phase2ga.result
          grep -qx 'NEW_LOCK_NAME=true' /tmp/phase2ga.result
          grep -qx 'SETUP_HASH_LOGIC=true' /tmp/phase2ga.result
          grep -qx 'CONSUME_LOGIC=true' /tmp/phase2ga.result
      - name: Verify rollback preserved live definition
        shell: bash
        run: |
          set -euo pipefail
          old=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin' and (pg_get_functiondef(p.oid) ilike '%Evolution Optical Admin%' or pg_get_functiondef(p.oid) ilike '%evolution_voucher:first_admin_bootstrap%');")
          test "$old" -ge 1
