name: Commercial Neutralization Phase 2B Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2b-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2b-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905104000_commercial_neutralization_phase2b_share_reporting.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test "$MIGRATION_PATH" = 'supabase/migrations/20260905104000_commercial_neutralization_phase2b_share_reporting.sql'
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"
          echo 'Commercial Phase 2B apply route lock passed.'

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Apply Phase 2B transactionally
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1
          echo 'Commercial Phase 2B committed.'

      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          names=(
            get_partner_voucher_share
            partner_recent_vouchers
            partner_voucher_summary
            staff_today_summary
            admin_dashboard_summary
            admin_voucher_report
          )
          for name in "${names[@]}"; do
            body=$(psql -v ON_ERROR_STOP=1 -Atqc "select string_agg(pg_get_functiondef(p.oid), E'\n') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='${name}';")
            test -n "$body"
            if grep -q 'Asia/Kuala_Lumpur' <<<"$body"; then echo "$name still has fixed timezone"; exit 1; fi
            if grep -q 'Evolution Optical' <<<"$body"; then echo "$name still has legacy brand copy"; exit 1; fi
            if grep -q 'EVO-FREE-GLASSES' <<<"$body"; then echo "$name still has legacy template code"; exit 1; fi
          done
          share_body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='get_partner_voucher_share' and pg_get_function_identity_arguments(p.oid)='p_voucher_id uuid';")
          grep -q 'Here is your voucher.' <<<"$share_body"
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2B_APPLIED=true'
