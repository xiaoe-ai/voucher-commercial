name: Commercial Neutralization Phase 2G-B Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2gb-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2gb-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905142000_commercial_neutralization_phase2gb_health_cron.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"
      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'
      - name: Execute Phase 2G-B and rollback
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo "select 'NO_FIXED_KL=' || (position('Asia/Kuala_Lumpur' in pg_get_functiondef(p.oid))=0) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='system_integrity_health_check';"
            echo "select 'NO_FIXED_3_MONTH=' || (position('3 months' in pg_get_functiondef(p.oid))=0) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='system_integrity_health_check';"
            echo "select 'VERSION_AWARE=' || (pg_get_functiondef(p.oid) ilike '%voucher_versions%' and pg_get_functiondef(p.oid) ilike '%valid_months%' and pg_get_functiondef(p.oid) ilike '%valid_days%' and pg_get_functiondef(p.oid) ilike '%valid_until%') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='system_integrity_health_check';"
            echo "select 'NEW_CRON=' || count(*) from cron.job where jobname='commercial_integrity_health_hourly' and schedule='7 * * * *' and command='select public.run_system_integrity_monitor();' and active=true;"
            echo "select 'OLD_CRON=' || count(*) from cron.job where jobname='evolution_integrity_health_hourly';"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1 -At | tee /tmp/phase2gb.result
          grep -qx 'NO_FIXED_KL=true' /tmp/phase2gb.result
          grep -qx 'NO_FIXED_3_MONTH=true' /tmp/phase2gb.result
          grep -qx 'VERSION_AWARE=true' /tmp/phase2gb.result
          grep -qx 'NEW_CRON=1' /tmp/phase2gb.result
          grep -qx 'OLD_CRON=0' /tmp/phase2gb.result
      - name: Verify rollback preserved live state
        shell: bash
        run: |
          set -euo pipefail
          old_cron=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from cron.job where jobname='evolution_integrity_health_hourly' and schedule='7 * * * *' and command='select public.run_system_integrity_monitor();' and active=true;")
          new_cron=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from cron.job where jobname='commercial_integrity_health_hourly';")
          body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='system_integrity_health_check';")
          test "$old_cron" = '1'
          test "$new_cron" = '0'
          grep -q 'Asia/Kuala_Lumpur' <<<"$body"
          echo 'Rollback preserved current live Phase 2G-B state.'
