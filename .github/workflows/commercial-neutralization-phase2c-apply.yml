name: Commercial Neutralization Phase 2C Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2c-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2c-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905111000_commercial_neutralization_phase2c_verify_redeem_extended.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          echo 'Commercial Phase 2C apply route lock passed.'

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Apply Phase 2C transactionally
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1

      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          verify_ok=$(psql -v ON_ERROR_STOP=1 -Atqc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='verify_voucher' and p.pronargs=2 and pg_get_functiondef(p.oid) not ilike '%Asia/Kuala_Lumpur%');")
          redeem_ok=$(psql -v ON_ERROR_STOP=1 -Atqc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='redeem_voucher' and p.pronargs=4 and pg_get_functiondef(p.oid) not ilike '%Asia/Kuala_Lumpur%');")
          overload_count=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('verify_voucher','redeem_voucher');")
          timezone_count=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('verify_voucher','redeem_voucher') and pg_get_functiondef(p.oid) ilike '%Asia/Kuala_Lumpur%';")
          echo "verify_ok=$verify_ok"
          echo "redeem_ok=$redeem_ok"
          echo "overload_count=$overload_count"
          echo "timezone_count=$timezone_count"
          test "$verify_ok" = 't'
          test "$redeem_ok" = 't'
          test "$overload_count" -eq 4
          test "$timezone_count" -eq 0
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2C_APPLIED=true'
