name: Commercial Neutralization Phase 2D Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2d-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2d-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905114500_commercial_neutralization_phase2d_partner_catalog.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Apply Phase 2D transactionally
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1

      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='partner_issuable_voucher_catalog';")
          test -n "$body"
          if grep -q 'Asia/Kuala_Lumpur' <<<"$body"; then echo 'fixed timezone still present'; exit 1; fi
          if grep -q "'RM'||" <<<"$body"; then echo 'hardcoded RM prefix still present'; exit 1; fi
          grep -q 'current_date' <<<"$body"
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2D_APPLIED=true'
