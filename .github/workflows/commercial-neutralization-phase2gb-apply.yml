name: Commercial Neutralization Phase 2G-B Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2gb-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2gb-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905142000_commercial_neutralization_phase2gb_health_cron.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          sha256sum "$MIGRATION_PATH"
      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'
      - name: Apply Phase 2G-B transactionally
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo 'COMMIT;'
          } | psql -v ON_ERROR_STOP=1
          echo 'Commercial Phase 2G-B committed.'
      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='system_integrity_health_check';")
          test -n "$body"
          ! grep -q 'Asia/Kuala_Lumpur' <<<"$body"
          ! grep -q '3 months' <<<"$body"
          grep -q 'voucher_versions' <<<"$body"
          grep -q 'valid_months' <<<"$body"
          grep -q 'valid_days' <<<"$body"
          grep -q 'valid_until' <<<"$body"
          old_cron=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from cron.job where jobname='evolution_integrity_health_hourly';")
          new_cron=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from cron.job where jobname='commercial_integrity_health_hourly' and schedule='7 * * * *' and command='select public.run_system_integrity_monitor();' and active=true;")
          test "$old_cron" = '0'
          test "$new_cron" = '1'
          monitor=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='run_system_integrity_monitor';")
          grep -q 'system_integrity_health_check' <<<"$monitor"
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2GB_APPLIED=true'
