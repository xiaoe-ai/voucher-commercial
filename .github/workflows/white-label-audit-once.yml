name: Commercial white-label residue audit once

on:
  push:
    paths:
      - '.github/workflows/white-label-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit textual residue
        shell: python
        run: |
          from pathlib import Path
          import re

          terms = [
              r'Evolution Optical',
              r'EVOLUTION OPTICAL',
              r'evolution-optical-voucher',
              r'Optical Voucher',
              r'EVO-',
          ]
          protected = {
              '.github/workflows/white-label-cleanup-once.yml',
              '.github/workflows/white-label-audit-once.yml',
              'WHITE_LABEL_MIGRATION_V1.md',
          }
          rows=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or str(p) in protected:
                  continue
              if p.suffix.lower() not in {'.html','.js','.json','.md','.txt','.yml','.yaml'}:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              for term in terms:
                  count=len(re.findall(term,text,re.I if term!='EVOLUTION OPTICAL' else 0))
                  if count:
                      rows.append((str(p),term,count))
          out=['# Commercial White-Label Residue Audit','', 'Generated: 2026-09-05','']
          if rows:
              out += ['| File | Term | Count |','|---|---|---:|']
              out += [f'| `{f}` | `{t}` | {c} |' for f,t,c in rows]
          else:
              out += ['No targeted EVO/Optical branding residue found in active textual files.']
          Path('WHITE_LABEL_AUDIT_RESULT.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
      - name: Commit audit result
        run: |
          git config user.name 'xiaoe-white-label-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add WHITE_LABEL_AUDIT_RESULT.md
          git commit -m 'chore: record white-label residue audit' || exit 0
          git push
