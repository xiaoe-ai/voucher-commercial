name: Commercial Neutralization Phase 2G-A Apply

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2ga-apply-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2ga-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905135000_commercial_neutralization_phase2ga_bootstrap.sql
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact Commercial route
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -f "$MIGRATION_PATH"
      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          test "$result" = 'postgres|postgres'
      - name: Apply Phase 2G-A transactionally
        shell: bash
        run: |
          set -euo pipefail
          { echo 'BEGIN;'; cat "$MIGRATION_PATH"; echo 'COMMIT;'; } | psql -v ON_ERROR_STOP=1
      - name: Verify live post-state
        shell: bash
        run: |
          set -euo pipefail
          body=$(psql -v ON_ERROR_STOP=1 -Atqc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='service_bootstrap_first_admin';")
          test -n "$body"
          ! grep -q 'Evolution Optical Admin' <<<"$body"
          ! grep -q 'evolution_voucher:first_admin_bootstrap' <<<"$body"
          grep -q 'Commercial Voucher Admin' <<<"$body"
          grep -q 'commercial_voucher:first_admin_bootstrap' <<<"$body"
          grep -q 'digest(p_setup_code' <<<"$body"
          grep -q 'consumed_at=now()' <<<"$body"
          echo 'COMMERCIAL_NEUTRALIZATION_PHASE2GA_APPLIED=true'
