name: Commercial Partner Display Fixture E2E V2

on:
  push:
    paths:
      - '.github/commercial-partner-display-fixture-e2e-v2-trigger'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run Partner issue-to-display browser fixture E2E
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/commercial-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > partner-e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          page.on('pageerror', e => console.log('PAGEERROR', e.message));
          const supabaseStub = `
          (()=>{
            const rows={
              branches:[{id:'b1',branch_code:'GEN01',branch_name:'Central Branch',status:'active',address_line1:'1 Main Street',address_line2:'',city:'Sample City',state:'',postcode:'10000',country:'Testland',phone:'+100000000',whatsapp:'',map_url:''}],
              partner_voucher_allocations:[{id:'a1',version_id:'v1',quantity_allocated:10,quantity_revoked:0,status:'active',valid_from:null,valid_until:null}],
              voucher_versions:[{id:'v1',template_id:'t1',version_no:1,version_name:'Launch',face_value:100,discount_percent:null,validity_type:'days_after_issue',validity_mode_v2:'days_after_issue',valid_days:30,valid_months:null,valid_from:null,valid_until:null,all_branches:true,status:'active',theme_override_code:null}],
              vouchers:[],voucher_version_branches:[{version_id:'v1',branch_id:'b1'}],
              voucher_templates:[{id:'t1',template_code:'CASH-100',template_name:'Welcome Voucher',voucher_category:'cash',status:'active',theme_code:'classic'}],partner_users:[],
              company_profile:[{id:true,company_name:'Acme Demo',legal_name:'Acme Demo Ltd',tagline:'Welcome',phone:'',website:'',logo_url:''}]
            };
            class Query{constructor(table){this.table=table}select(){return this}eq(){return this}is(){return this}order(){return this}in(){return this}maybeSingle(){return Promise.resolve({data:(rows[this.table]||[])[0]||null,error:null})}single(){return Promise.resolve({data:(rows[this.table]||[])[0]||null,error:null})}then(resolve,reject){return Promise.resolve({data:rows[this.table]||[],error:null}).then(resolve,reject)}}
            const db={auth:{getSession:async()=>({data:{session:{user:{id:'u1',email:'fixture@example.test'}}}}),getUser:async()=>({data:{user:{id:'u1',email:'fixture@example.test'}}}),signOut:async()=>({error:null}),signInWithPassword:async()=>({error:null}),updateUser:async()=>({error:null})},rpc:async(name,args)=>{if(name==='get_my_partner_dashboard')return {data:{partner_id:'p1',partner_name:'Acme Demo',partner_code:'DEMO001',role:'partner_staff',staff_name:'Fixture Staff',staff_access_enabled:true,can_issue_voucher:true},error:null};if(name==='get_my_partner_claim_access')return {data:{all_branches:true,branch_codes:['GEN01'],branch_names:['Central Branch']},error:null};if(name==='create_partner_multi_voucher_controlled')return {data:{voucher_code:'V-20260905-TEST1234',expiry_date:'2026-10-05',issued_by_name:'Fixture Staff'},error:null};return {data:null,error:null}},from:(table)=>new Query(table),functions:{invoke:async()=>({data:{success:true},error:null})}};
            window.supabase={createClient:()=>db};
          })();`;
          await page.route('**/supabase-js@2', route=>route.fulfill({status:200,contentType:'application/javascript',body:supabaseStub}));
          await page.route('**/qrcode.min.js', route=>route.fulfill({status:200,contentType:'application/javascript',body:`window.QRCode=function(node,opt){node.textContent='QR:'+opt.text};window.QRCode.CorrectLevel={M:'M'};`}));
          await page.route('**/html2canvas.min.js', route=>route.fulfill({status:200,contentType:'application/javascript',body:`window.html2canvas=async()=>({toBlob:(cb)=>cb(new Blob(['x'],{type:'image/png'}))});`}));
          await page.goto('http://127.0.0.1:4173/partner.html',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>!document.getElementById('dashboard').classList.contains('hidden'));
          await page.waitForFunction(()=>document.getElementById('createBtn').disabled===false);
          await page.fill('#customerName','Fixture Customer');
          await page.fill('#customerPhone','0123456789');
          await page.click('#createBtn');
          await page.waitForFunction(()=>!document.getElementById('voucherResultCard').classList.contains('hidden'));
          const preview=await page.locator('.approved-voucher').innerText();
          console.log(preview);
          for(const required of ['Acme Demo','Fixture Customer','V-20260905-TEST1234','Central Branch']) if(!preview.includes(required)) throw new Error('Missing expected rendered value: '+required);
          for(const forbidden of ['Evolution Optical','EVO','The Mines','Damai Perdana','FREE GLASSES','RM60','Sdn Bhd','EO-2026']) if(preview.toLowerCase().includes(forbidden.toLowerCase())) throw new Error('Forbidden legacy value rendered: '+forbidden);
          const redeem=await page.locator('#giftRedeemLocations').innerText();
          if(redeem.trim()!=='Central Branch\nTel: +100000000') throw new Error('Unexpected generic branch render: '+redeem);
          console.log('PARTNER_ISSUE_DISPLAY_FIXTURE_E2E=PASS');
          await browser.close();
          JS
          node partner-e2e.mjs
      - name: Self-remove one-time E2E files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/commercial-partner-display-fixture-e2e.yml || true
          git rm -f .github/commercial-partner-display-fixture-e2e-trigger || true
          git rm -f .github/workflows/commercial-partner-display-fixture-e2e-v2.yml
          git rm -f .github/commercial-partner-display-fixture-e2e-v2-trigger
          rm -f package.json package-lock.json partner-e2e.mjs
          git config user.name 'Xiao-E-26'
          git config user.email 'xiaoeai2026@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean completed Partner display fixture E2E files'
          git push origin HEAD:main
