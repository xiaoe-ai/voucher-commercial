name: Commercial Neutralization Phase 2C Dry Run

on:
  push:
    paths:
      - '.github/commercial-neutralization-phase2c-trigger'

permissions:
  contents: read

concurrency:
  group: commercial-neutralization-phase2c-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_PATH: supabase/migrations/20260905111000_commercial_neutralization_phase2c_verify_redeem_extended.sql

    steps:
      - uses: actions/checkout@v4

      - name: Guard exact Commercial route and migration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          test -n "${PGPASSWORD:-}"
          test -f "$MIGRATION_PATH"
          echo 'Commercial Phase 2C dry-run route lock passed.'

      - name: Verify live connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Execute Phase 2C and rollback in one session
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            cat "$MIGRATION_PATH"
            echo "select 'VERIFY_OK=' || exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='verify_voucher' and p.pronargs=2 and pg_get_functiondef(p.oid) not ilike '%Asia/Kuala_Lumpur%');"
            echo "select 'REDEEM_OK=' || exists (select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='redeem_voucher' and p.pronargs=4 and pg_get_functiondef(p.oid) not ilike '%Asia/Kuala_Lumpur%');"
            echo "select 'OVERLOAD_COUNT=' || count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('verify_voucher','redeem_voucher');"
            echo 'ROLLBACK;'
          } | tee /tmp/phase2c.out | psql -v ON_ERROR_STOP=1 | tee /tmp/phase2c.result

          grep -qx 'VERIFY_OK=true' /tmp/phase2c.result
          grep -qx 'REDEEM_OK=true' /tmp/phase2c.result
          grep -qx 'OVERLOAD_COUNT=4' /tmp/phase2c.result
          echo 'Commercial Phase 2C dry-run completed and rolled back.'

      - name: Verify rollback preserved live timezone residue
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(psql -v ON_ERROR_STOP=1 -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('verify_voucher','redeem_voucher') and pg_get_functiondef(p.oid) ilike '%Asia/Kuala_Lumpur%';")
          echo "timezone-bearing overloads after rollback: $remaining"
          test "$remaining" -eq 2
