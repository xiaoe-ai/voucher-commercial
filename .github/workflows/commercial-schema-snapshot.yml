name: Commercial Schema Snapshot V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/schema-snapshot-trigger'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hukihbcyyqhanaqrizvm
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.hukihbcyyqhanaqrizvm
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Guard Commercial route and required secret
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = 'hukihbcyyqhanaqrizvm'
          test "$PGHOST" = 'aws-0-ap-southeast-1.pooler.supabase.com'
          test "$PGPORT" = '5432'
          test "$PGDATABASE" = 'postgres'
          test "$PGUSER" = 'postgres.hukihbcyyqhanaqrizvm'
          if [ -z "${PGPASSWORD:-}" ]; then
            echo 'MISSING: SUPABASE_DB_PASSWORD'
            exit 2
          fi
          echo 'Commercial route lock and DB secret guard passed.'

      - name: Verify read-only connection
        shell: bash
        run: |
          set -euo pipefail
          result=$(psql -v ON_ERROR_STOP=1 -Atqc "select current_database() || '|' || current_user;")
          echo "Connected as: $result"
          test "$result" = 'postgres|postgres'

      - name: Export public schema only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          pg_dump \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-privileges \
            --file=snapshot/commercial-public-schema.sql
          test -s snapshot/commercial-public-schema.sql
          sha256sum snapshot/commercial-public-schema.sql | tee snapshot/commercial-public-schema.sha256

      - name: Export function and policy inventory
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -AtF $'\t' -c "
            select n.nspname,
                   p.proname,
                   pg_get_function_identity_arguments(p.oid),
                   pg_get_function_result(p.oid),
                   p.prosecdef,
                   coalesce(array_to_string(p.proconfig, ','), '')
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
            order by p.proname, pg_get_function_identity_arguments(p.oid);
          " > snapshot/public-functions.tsv

          psql -v ON_ERROR_STOP=1 -AtF $'\t' -c "
            select schemaname,
                   tablename,
                   policyname,
                   permissive,
                   roles,
                   cmd,
                   coalesce(qual, ''),
                   coalesce(with_check, '')
            from pg_policies
            where schemaname = 'public'
            order by tablename, policyname;
          " > snapshot/public-rls-policies.tsv

          psql -v ON_ERROR_STOP=1 -AtF $'\t' -c "
            select t.table_schema,
                   t.table_name,
                   c.relrowsecurity
            from information_schema.tables t
            join pg_namespace n on n.nspname = t.table_schema
            join pg_class c on c.relnamespace = n.oid and c.relname = t.table_name
            where t.table_schema = 'public' and t.table_type = 'BASE TABLE'
            order by t.table_name;
          " > snapshot/public-table-rls.tsv

      - name: Write snapshot metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "project_ref=$PROJECT_REF"
            echo "git_sha=$GITHUB_SHA"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scope=public-schema-only"
            echo "contains_data=false"
            echo "contains_secret_values=false"
          } > snapshot/metadata.txt

      - name: Upload schema snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: commercial-schema-snapshot-${{ github.run_id }}
          path: snapshot/
          if-no-files-found: error
          retention-days: 7
