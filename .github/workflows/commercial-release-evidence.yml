name: Commercial Release Evidence Audit

on:
  push:
    paths:
      - '.github/commercial-release-evidence-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deep current-runtime legacy audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          runtime_files = [
            'index.html','admin.html','admin-core.html','partner.html','staff.html',
            'voucher-engine.html','company-setup.html','commercial-brand.js',
            'voucher-theme-system-v1.js','manifest-admin.json','manifest-partner.json',
            'manifest-staff.json','sw.js'
          ]
          patterns = {
            'Evolution Optical': re.compile(r'Evolution Optical', re.I),
            'EOVoucher': re.compile(r'EOVoucher', re.I),
            'eo-build-id': re.compile(r'name="eo-[^"]*build"', re.I),
            'EO voucher prefix': re.compile(r'EO-20\d{6,}'),
            'RM60 compatibility copy': re.compile(r'RM60', re.I),
            'hardcoded EVO outlet': re.compile(r'The Mines Shopping Mall|Damai Perdana 6/1E|CS Bangi|Pertama Shopping Complex', re.I),
            'fixed Malaysia locale': re.compile(r'en-MY'),
            'evolution export name': re.compile(r'evolution-vouchers-', re.I),
          }
          findings=[]
          for rel in runtime_files:
            path=Path(rel)
            if not path.exists():
              continue
            text=path.read_text(errors='ignore')
            for label,rx in patterns.items():
              if rx.search(text): findings.append((rel,label))
          if findings:
            print('RUNTIME_LEGACY_FINDINGS')
            for rel,label in findings: print(f'{rel} :: {label}')
            raise SystemExit(1)
          print('CURRENT_RUNTIME_LEGACY_AUDIT=PASS')
          PY

      - name: Verify canonical source identifiers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'commercial-partner-build' partner.html
          grep -q 'commercial-admin-build' admin.html
          grep -q 'commercial-voucher-engine-build' voucher-engine.html
          grep -q 'window.CommercialVoucherThemes=' voucher-theme-system-v1.js
          ! grep -q 'const OUTLETS=' partner.html
          ! grep -q 'EOVoucherThemes' partner.html voucher-engine.html voucher-theme-system-v1.js
          echo 'CANONICAL_FRONTEND_IDENTIFIERS=PASS'

      - name: Verify public Pages routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://xiaoe-ai.github.io/voucher-commercial'
          routes=(
            '/'
            '/admin.html'
            '/partner.html'
            '/staff.html'
            '/company-setup.html'
            '/voucher-engine.html'
          )
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route -> $code"
            test "$code" = '200'
            test -s /tmp/page.html
          done
          echo 'PUBLIC_PAGES_ROUTES=PASS'

      - name: Verify manifests
        shell: bash
        run: |
          set -euo pipefail
          for f in manifest-admin.json manifest-partner.json manifest-staff.json; do
            test -s "$f"
            python -m json.tool "$f" >/dev/null
          done
          echo 'PWA_MANIFESTS=PASS'
